name: Deployment validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployment and pinned core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - name: Set up Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Test operational alert monitor without sending
        run: "${{ steps.python.outputs.python-path }}" -B scripts/operational-alerts.test.py
      - name: Install the core profile loader dependency
        run: |
          "${{ steps.python.outputs.python-path }}" -m venv .validate-venv
          .validate-venv/bin/python -m pip install --quiet -c core/constraints.txt pydantic
      - name: Validate brand profile and production Compose contract
        run: .validate-venv/bin/python scripts/validate.py
