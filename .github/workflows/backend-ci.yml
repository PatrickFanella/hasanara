name: Backend CI - Lint & Test

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'worker/**'
      - '*.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'requirements-ml-runtime.txt'
      - 'constraints.txt'
      - 'Makefile'
      - 'docker-compose*.yml'
      - 'Dockerfile*'
      - '.python-version'
      - 'tests/**'
      - 'scripts/**'
      - 'alembic/**'
      - 'sql/**'
      - 'mypy-baseline.json'
      - 'pyproject.toml'
      - '.github/workflows/backend-ci.yml'
      - '.gitea/workflows/**'
  pull_request:
    paths:
      - 'app/**'
      - 'worker/**'
      - '*.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'requirements-ml-runtime.txt'
      - 'constraints.txt'
      - 'Makefile'
      - 'docker-compose*.yml'
      - 'Dockerfile*'
      - '.python-version'
      - 'tests/**'
      - 'scripts/**'
      - 'alembic/**'
      - 'sql/**'
      - 'mypy-baseline.json'
      - 'pyproject.toml'
      - '.github/workflows/backend-ci.yml'
      - '.gitea/workflows/**'
  workflow_dispatch:

jobs:
  supported-python:
    name: Python ${{ matrix.python-version }} import and unit smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install supported runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt
      - name: Import API and worker packages
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hasanara_test
          SESSION_SECRET: test-secret-key-for-ci-only
        run: |
          python -c "import app.main, worker.loop, worker.youtube.service"
      - name: Run database-independent unit smoke
        run: |
          pytest -q tests/test_archive_intelligence_query_domains.py tests/worker/test_worker_lifecycle.py tests/worker/test_worker_module_boundaries.py

  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.txt
          pip install -c constraints.txt -r requirements-dev.txt

      - name: Run ruff check
        run: |
          ruff check app/ worker/ scripts/ --output-format=github

      - name: Run black check
        run: |
          black --check app/ worker/ scripts/

      - name: Run isort check
        run: |
          isort --check-only app/ worker/ scripts/ tests/ alembic/

      - name: Run mypy type check
        run: |
          mypy app/ worker/ scripts/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pip-audit==2.8.0' 'bandit[toml]==1.8.0'
          pip install -c constraints.txt -r requirements.txt

      - name: Run pip-audit for dependency vulnerabilities
        run: |
          PIP_AUDIT_IGNORE_OUTPUT="$(python scripts/check_security_exceptions.py --pip-audit-args)"
          read -r -a PIP_AUDIT_IGNORE <<< "$PIP_AUDIT_IGNORE_OUTPUT"
          pip-audit --local --desc --skip-editable \
            "${PIP_AUDIT_IGNORE[@]}"

      - name: Run bandit for code security issues
        run: |
          bandit -r app/ worker/ -lll -ii -f json -o bandit-report.json
          bandit -r app/ worker/ -lll -ii -f screen

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  test:
    name: Test with PostgreSQL
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hasanara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.txt
          pip install -c constraints.txt -r requirements-dev.txt

      - name: Apply database schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hasanara_test
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d hasanara_test -f sql/schema.sql

      - name: Run pytest with coverage
        env:
          ENVIRONMENT: test
          ALLOW_DESTRUCTIVE_TEST_DB: "1"
          ALLOW_EVENT_TOKEN_CONTRACT_MIGRATION: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hasanara_test
          HASANARA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hasanara_test
          ANALYTICS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hasanara_test
          SESSION_SECRET: test-secret-key-for-ci-only
          FRONTEND_ORIGIN: http://localhost:5173
        run: |
          pytest tests/ --cov=app --cov=worker --cov-report=xml --cov-report=term --cov-report=html -v

      - name: Generate coverage summary
        if: always()
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          coverage report --skip-empty >> $GITHUB_STEP_SUMMARY || echo "Coverage report generation failed" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=70

  migrations:
    name: Migration head validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hasanara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt
      - name: Upgrade and validate the single migration head
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hasanara_test
          ALLOW_EVENT_TOKEN_CONTRACT_MIGRATION: "true"
        run: |
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1
          test "$(alembic current | awk '{print $1}')" = "$(alembic heads | awk '{print $1}')"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (CPU-compatible check)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.cpu
          push: false
          tags: transcript-create:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
