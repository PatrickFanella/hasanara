name: Mirror CI
run-name: Mirror CI ${{ github.sha }}
# Pull request verification for the Gitea source, run on its public GitHub copy.
# Main is verified, published and deployed by .gitea/workflows/validate.yaml.
'on':
  push:
    branches-ignore:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    name: Deployment contract
    if: github.repository == 'subculture-collective/hasanara'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      frontend: ${{ steps.plan.outputs.frontend }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - name: Checkout deployment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out the pinned core from its public copy
        # .gitmodules names ../transcript-create.git, the Gitea name of rekolekt.
        # On GitHub that relative URL resolves to a different, private repository.
        run: |
          set -euo pipefail
          git config submodule.core.url https://github.com/subculture-collective/rekolekt.git
          git submodule update --init --depth 1 core
          git submodule status core
      - name: Set up Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: core/constraints.txt
      - name: Fetch main as the pull request base
        id: base
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/main
          printf 'sha=%s\n' "$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select applicable checks
        id: plan
        env:
          # Same selection as a Gitea pull request into main: diff main's tip
          # against this branch head. Publication is never selected here.
          CI_EVENT: pull_request
          CI_REF: ${{ github.ref }}
          CI_SHA: ${{ github.sha }}
          CI_BASE: ${{ steps.base.outputs.sha }}
        run: |
          "${{ steps.python.outputs.python-path }}" -B scripts/ci.test.py
          "${{ steps.python.outputs.python-path }}" -B scripts/ci_plan.py
      - name: Test operational alert monitor without sending
        run: |
          "${{ steps.python.outputs.python-path }}" -B scripts/operational-alerts.test.py
      - name: Test the web image manifest and the deployment wrapper
        run: |
          "${{ steps.python.outputs.python-path }}" -B scripts/web_manifest.test.py
      - name: Install the core profile loader dependency
        run: |
          "${{ steps.python.outputs.python-path }}" -m venv .validate-venv
          .validate-venv/bin/python -m pip install --quiet -c core/constraints.txt pydantic
      - name: Validate brand profile and production Compose contract
        run: .validate-venv/bin/python scripts/validate.py

  frontend:
    name: Frontend checks and browser tests
    needs: contract
    if: github.repository == 'subculture-collective/hasanara' && needs.contract.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out the pinned core from its public copy
        run: |
          set -euo pipefail
          git config submodule.core.url https://github.com/subculture-collective/rekolekt.git
          git submodule update --init --depth 1 core
          git submodule status core
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend and browser-test dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e
      - name: Check API types against the pinned core's OpenAPI document
        run: npm --prefix frontend run api:check
      - name: Dependency security gate
        run: npm --prefix frontend run security:check
      - name: Lint and format
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run format:check
      - name: Unit tests with coverage
        run: npm --prefix frontend run test:coverage
      - name: Build and check the bundle budget
        run: |
          npm --prefix frontend run build
          npm --prefix frontend run bundle:check
      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Run browser tests against mocked API routes
        working-directory: e2e
        run: npx playwright test tests/archive-smoke.spec.ts tests/transcript-highlighting.spec.ts --project=chromium --workers=1
      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-browser-tests
          if-no-files-found: ignore
          retention-days: 1
          path: |
            e2e/test-results
            e2e/playwright-report

  web-image:
    name: Web image build and smoke test
    needs: contract
    if: github.repository == 'subculture-collective/hasanara' && needs.contract.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout web source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build the web image without publishing
        run: |
          docker build --file frontend/Dockerfile --build-arg GIT_COMMIT='${{ github.sha }}' \
            --tag 'hasanara-web-ci:${{ github.run_id }}' .
      - name: Smoke-test the image with the HasanAra profile
        run: scripts/web_image_smoke.sh 'hasanara-web-ci:${{ github.run_id }}'

  mirror-gate:
    name: Mirror CI gate
    if: always() && github.repository == 'subculture-collective/hasanara'
    needs:
      - contract
      - frontend
      - web-image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {'contract', 'frontend', 'web-image'}
          assert set(results) == expected, results
          assert results["contract"]["result"] == "success", "contract did not pass"
          selected = results["contract"]["outputs"]
          # As in scripts/ci_gate.py: a job may be skipped only when the
          # contract selected it off for this diff; any other result fails.
          for name, output in (("frontend", "frontend"), ("web-image", "image")):
              assert selected.get(output) in ("true", "false"), name + " selection missing"
              allowed = ("success",) if selected[output] == "true" else ("success", "skipped")
              assert results[name]["result"] in allowed, name + " did not pass"
          PY
